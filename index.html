<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Run Game</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    background: #111;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

#run {
    width: 240px;
    height: 85px;
    border: 0;
    border-radius: 20px;
    background: white;
    color: black;
    font-size: 30px;
    font-weight: bold;
    cursor: pointer;
}

#run:focus {
    outline: 5px solid #aaa;
}
</style>
</head>

<body>

<button id="run" autofocus>▶ RUN</button>

<script>
const GAME =
"https://poki.com/fr/g/subway-surfers#utm_source=redirect-en-fr";

function openGame() {
    try {
        window.top.location.href = GAME;
    } catch (e) {
        window.location.href = GAME;
    }
}

document.getElementById("run").addEventListener("click", openGame);

document.addEventListener("keydown", function(e) {
    if (e.key === "Enter" || e.keyCode === 13 || e.keyCode === 23) {
        openGame();
    }
});
</script>

</body>
</html>
