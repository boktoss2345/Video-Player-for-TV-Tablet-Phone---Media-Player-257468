<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Play Roblox</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #090b10;
        font-family: Arial, Helvetica, sans-serif;
        color: white;
    }

    body {
        position: fixed;
        inset: 0;
    }

    /* =========================
       GENERAL PAGES
    ========================= */

    .page {
        position: absolute;
        inset: 0;

        width: 100%;
        height: 100%;

        display: none;

        align-items: center;
        justify-content: center;
        flex-direction: column;
    }

    .page.active {
        display: flex;
    }


    /* =========================
       FIRST PAGE
    ========================= */

    #playPage {
        background:
            radial-gradient(
                circle at center,
                #252a35 0%,
                #101218 55%,
                #050609 100%
            );
    }

    .logoBox {
        width: 115px;
        height: 115px;

        border-radius: 26px;

        background: #ffffff;

        display: flex;
        align-items: center;
        justify-content: center;

        margin-bottom: 35px;

        box-shadow:
            0 15px 45px rgba(0, 0, 0, 0.45);
    }

    .logoInner {
        width: 55px;
        height: 55px;

        background: #111;

        transform: rotate(15deg);

        position: relative;
    }

    .logoInner::after {
        content: "";

        position: absolute;

        width: 20px;
        height: 20px;

        background: #fff;

        left: 17px;
        top: 17px;
    }


    /* =========================
       BUTTON
    ========================= */

    .playBtn {
        min-width: 230px;

        padding: 20px 45px;

        border: none;
        border-radius: 14px;

        background: #ffffff;
        color: #111111;

        font-size: 25px;
        font-weight: 800;

        cursor: pointer;

        box-shadow:
            0 12px 35px rgba(0, 0, 0, 0.4);

        transition:
            transform 0.15s ease,
            box-shadow 0.15s ease;
    }

    .playBtn:hover {
        transform: scale(1.04);
    }

    .playBtn:active {
        transform: scale(0.96);
    }


    /* =========================
       SECOND PAGE
    ========================= */

    #robloxPage {
        background:
            radial-gradient(
                circle at center,
                #202631 0%,
                #10131a 55%,
                #06070a 100%
            );
    }

    .title {
        font-size: 38px;
        font-weight: 900;

        margin-bottom: 12px;

        text-align: center;
    }

    .subtitle {
        font-size: 17px;

        opacity: 0.65;

        margin-bottom: 35px;

        text-align: center;
    }

    .robloxBtn {
        min-width: 280px;

        padding: 20px 40px;

        border: none;
        border-radius: 15px;

        background: #00b06b;
        color: #ffffff;

        font-size: 25px;
        font-weight: 900;

        cursor: pointer;

        box-shadow:
            0 12px 35px rgba(0, 176, 107, 0.25);

        transition:
            transform 0.15s ease,
            box-shadow 0.15s ease;
    }

    .robloxBtn:hover {
        transform: scale(1.04);

        box-shadow:
            0 15px 40px rgba(0, 176, 107, 0.35);
    }

    .robloxBtn:active {
        transform: scale(0.96);
    }


    /* =========================
       LOADING PAGE
    ========================= */

    #loadingPage {
        background:
            radial-gradient(
                circle at center,
                #171b23 0%,
                #090b10 65%,
                #050609 100%
            );
    }

    .loader {
        width: 82px;
        height: 82px;

        border: 8px solid rgba(255, 255, 255, 0.12);

        border-top-color: #ffffff;

        border-radius: 50%;

        animation: spin 0.8s linear infinite;

        margin-bottom: 32px;
    }

    @keyframes spin {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    .loadingText {
        font-size: 30px;
        font-weight: 900;

        letter-spacing: 4px;

        text-align: center;
    }

    .loadingSub {
        margin-top: 14px;

        font-size: 15px;

        opacity: 0.55;

        text-align: center;
    }


    /* =========================
       FIRE TV / KEYBOARD FOCUS
    ========================= */

    button:focus {
        outline: 4px solid #ffffff;
        outline-offset: 6px;
    }


    /* =========================
       PHONE
    ========================= */

    @media (max-width: 600px) {

        .logoBox {
            width: 100px;
            height: 100px;
        }

        .logoInner {
            width: 48px;
            height: 48px;
        }

        .logoInner::after {
            width: 18px;
            height: 18px;

            left: 15px;
            top: 15px;
        }

        .title {
            font-size: 30px;
        }

        .playBtn,
        .robloxBtn {
            font-size: 21px;
        }

        .loader {
            width: 70px;
            height: 70px;
        }

        .loadingText {
            font-size: 25px;
        }
    }

</style>
</head>

<body>


<!-- =====================================
     PAGE 1
===================================== -->

<div id="playPage" class="page active">

    <div class="logoBox">

        <div class="logoInner"></div>

    </div>

    <button
        id="playButton"
        class="playBtn"
        onclick="showRobloxPage()">

        PLAY

    </button>

</div>


<!-- =====================================
     PAGE 2
===================================== -->

<div id="robloxPage" class="page">

    <div class="title">
        Ready to Play?
    </div>

    <div class="subtitle">
        Start your adventure
    </div>

    <button
        id="robloxButton"
        class="robloxBtn"
        onclick="startLaunch()">

        Play Roblox

    </button>

</div>


<!-- =====================================
     LOADING PAGE
===================================== -->

<div id="loadingPage" class="page">

    <div class="loader"></div>

    <div class="loadingText">
        LOADING...
    </div>

    <div class="loadingSub">
        Please wait
    </div>

</div>


<script>

/* =====================================
   PAGE SYSTEM
===================================== */

function showPage(pageId) {

    const pages =
        document.querySelectorAll(".page");

    pages.forEach(function(page) {

        page.classList.remove("active");

    });


    const selectedPage =
        document.getElementById(pageId);

    if (selectedPage) {

        selectedPage.classList.add("active");

    }

}


/* =====================================
   PLAY BUTTON
===================================== */

function showRobloxPage() {

    showPage("robloxPage");


    // Focus button automatically
    // useful for Fire TV

    setTimeout(function() {

        const button =
            document.getElementById(
                "robloxButton"
            );

        if (button) {
            button.focus();
        }

    }, 100);

}


/* =====================================
   PLAY ROBLOX
===================================== */

function startLaunch() {

    /*
       Only show loading screen.

       NO ads.json
       NO fetch()
       NO API
       NO external call
    */

    showPage("loadingPage");

}


/* =====================================
   INITIAL FOCUS
===================================== */

window.addEventListener(
    "load",
    function() {

        setTimeout(function() {

            const button =
                document.getElementById(
                    "playButton"
                );

            if (button) {
                button.focus();
            }

        }, 200);

    }
);


/* =====================================
   PREVENT SCROLL
===================================== */

document.addEventListener(
    "touchmove",
    function(event) {

        event.preventDefault();

    },
    {
        passive: false
    }
);

</script>


</body>
</html>
