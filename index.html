<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#game {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    border: 0;
    display: block;
}
</style>
</head>

<body>

<iframe
    id="game"
    src="https://www.madkidgames.com/full/subway-surfers"
    frameborder="0"
    scrolling="no"
    allow="autoplay; fullscreen; gamepad"
    allowfullscreen>
</iframe>

</body>
</html>
